[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-fixed-by"
version = "0.2.0"
description = "Prove your regression test catches the regression"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pytest>=7.0"]
authors = [
    { name = "AIIT", email = "info@aiit.dev" },
]
keywords = ["pytest", "testing", "regression", "git", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.entry-points.pytest11]
fixed_by = "pytest_fixed_by.plugin"

[project.urls]
Homepage = "https://ruachtov.ai"
Repository = "https://github.com/Ruach-Tov/pytest-fixed-by"
Issues = "https://github.com/Ruach-Tov/pytest-fixed-by/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_fixed_by"]
